name: zz-create-release-tag
# Temporary, dispatch-only helper: creates a tag ref at a given commit.
# Used once to cut v3.4.2 when direct tag pushes were unavailable; safe to delete.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to create (e.g. v3.4.2)'
        required: true
      sha:
        description: 'Commit SHA the tag should point at'
        required: true
permissions:
  contents: write
jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          gh api -X POST "repos/${REPO}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${SHA}"
