name: zz-create-release-tag
# Temporary, dispatch-only helper: creates or updates the GitHub Release for an
# existing tag from a notes file in the repo. Used to cut v3.4.2 when direct tag
# pushes / release API were unavailable from the working session. Safe to delete.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release'
        required: true
      notes_path:
        description: 'Path to the release notes file (on this branch)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes_path }}
        run: |
          title="${TAG} — Security hardening"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$NOTES"
          else
            gh release create "$TAG" --verify-tag --title "$title" --notes-file "$NOTES"
          fi
