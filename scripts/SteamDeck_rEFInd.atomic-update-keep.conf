# SteamDeck_rEFInd: keep these root-owned files across SteamOS atomic updates.
#
# Since SteamOS 3.6 an OS update discards every change under /etc except the
# paths listed in /usr/lib/rauc/atomic-update-keep.conf and in the drop-ins
# under /etc/atomic-update.conf.d/. The default list already keeps the systemd
# units and their .wants symlinks, but not the files those units execute
# (restore_EFI_entries.sh, SteamDeck_rEFInd_helper, background-dir) nor the
# sudoers rule the GUI needs for passwordless Install Config / Install Themes.
# Installed as /etc/atomic-update.conf.d/SteamDeck_rEFInd.conf (itself kept).
/etc/SteamDeck_rEFInd/**
/etc/sudoers.d/zz_SteamDeck_rEFInd_install_config
